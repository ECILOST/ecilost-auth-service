name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to deploy to PROD (sha-<40 character commit SHA>)
        required: true
        type: string

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    # Las e2e levantan la aplicacion completa contra PostgreSQL real (esquema auth_test) y
    # publican user.created en RabbitMQ, igual que en docker-compose.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecilost
          POSTGRES_PASSWORD: ecilost
          POSTGRES_DB: ecilost_auth
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecilost -d ecilost_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: ecilost
          RABBITMQ_DEFAULT_PASS: ecilost
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare build-only database URL
        run: printf 'DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build\n' > .env
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      # .env.test no se versiona: se arma desde la plantilla con un par RS256 desechable,
      # generado en cada corrida. No hay ningun secreto real en este paso.
      - name: Prepare e2e environment
        run: |
          cp .env.test.example .env.test
          sed -i '/^JWT_PRIVATE_KEY=$/d;/^JWT_PUBLIC_KEY=$/d' .env.test
          node -e "const{generateKeyPairSync}=require('node:crypto');const{privateKey,publicKey}=generateKeyPairSync('rsa',{modulusLength:2048});console.log('JWT_PRIVATE_KEY='+Buffer.from(privateKey.export({type:'pkcs8',format:'pem'})).toString('base64'));console.log('JWT_PUBLIC_KEY='+Buffer.from(publicKey.export({type:'spki',format:'pem'})).toString('base64'))" >> .env.test
      - name: E2E tests (PostgreSQL + RabbitMQ)
        run: npm run test:e2e
      - name: Build
        run: npm run build

  # Imagenes en GitHub Container Registry (gratis para paquetes publicos) en lugar de ACR.
  publish-image:
    if: github.event_name == 'push'
    needs: node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ecilost/ecilost-auth-service
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    if: github.event_name == 'push' && github.ref_name == 'develop' && vars.DEV_CONTAINER_APP_NAME != ''
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable image to DEV
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.DEV_CONTAINER_APP_NAME }}
          IMAGE: ghcr.io/ecilost/ecilost-auth-service:sha-${{ github.sha }}
        run: az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && vars.PROD_CONTAINER_APP_NAME != ''
    needs: node
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy selected immutable image to PROD
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.PROD_CONTAINER_APP_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "Use an immutable sha-<40 character commit SHA> tag"; exit 1; }
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "ghcr.io/ecilost/ecilost-auth-service:$IMAGE_TAG"
